  baseURL: https://api.amazonalexa.com
  properties:
  - type: Documentation
    url: https://developer.amazon.com/en-US/docs/alexa/rest-apis/rest-apis.html
  description: >-
    The Alexa Skills Kit (ASK) REST APIs enable developers to create, manage, test, and deploy custom
    voice skills for Alexa-enabled devices including skill manifest management, interaction model building,
    and hosted skill management for voice experiences and smart home integrations.

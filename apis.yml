  - Products
  humanURL: https://affiliate-program.amazon.com/creatorsapi/docs/en-us/introduction
  baseURL: https://affiliate-program.amazon.com/creatorsapi
  properties:
  - type: Documentation
    url: https://affiliate-program.amazon.com/creatorsapi/docs/en-us/introduction
  description: >-
    The Amazon Creators API provides programmatic access to Amazon product data for publishers, influencers,
    and affiliate partners. It is the recommended replacement for the Product Advertising API and requires
    Amazon Associates membership with qualifying sales history.
- aid: amazon:alexa-skills-kit-api
  name: Amazon Alexa Skills Kit API
  tags:

aid: amazon
name: Amazon
description: Amazon is a global technology and e-commerce company offering a wide
  range of consumer and developer APIs including the Selling Partner API for marketplace
  sellers, Advertising API for campaign management, Amazon Pay for payments, Alexa
  Skills Kit for voice experiences, Amazon Appstore for mobile applications, and the
  Creators API for affiliate publishers. These APIs power Amazon's ecosystem of sellers,
  developers, advertisers, and content creators.

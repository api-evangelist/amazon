naftiko: 1.0.0-alpha2
info:
  label: Amazon Advertising API — Profiles
  description: 'Amazon Advertising API — Profiles. 1 operations. Lead operation: Amazon List Advertising Profiles. Self-contained
    Naftiko capability covering one Amazon business surface.'
  tags:
  - Amazon
  - Profiles
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMAZON_API_KEY: AMAZON_API_KEY
capability:
  consumes:
  - type: http
    namespace: advertising-profiles
    baseUri: https://advertising-api.amazon.com
    description: Amazon Advertising API — Profiles business capability. Self-contained, no shared references.
    resources:
    - name: v2-profiles
      path: /v2/profiles
      operations:
      - name: listprofiles
        method: GET
        description: Amazon List Advertising Profiles
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.AMAZON_API_KEY}}'
  exposes:
  - type: rest
    namespace: advertising-profiles-rest
    port: 8080
    description: REST adapter for Amazon Advertising API — Profiles. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v2/profiles
      name: v2-profiles
      description: REST surface for v2-profiles.
      operations:
      - method: GET
        name: listprofiles
        description: Amazon List Advertising Profiles
        call: advertising-profiles.listprofiles
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: advertising-profiles-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amazon Advertising API — Profiles. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: amazon-list-advertising-profiles
      description: Amazon List Advertising Profiles
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: advertising-profiles.listprofiles
      outputParameters:
      - type: object
        mapping: $.

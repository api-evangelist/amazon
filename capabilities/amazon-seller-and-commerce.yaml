naftiko: 1.0.0-alpha2
info:
  label: Amazon Seller and Commerce Workflow
  description: Unified workflow for Amazon sellers, advertisers, and merchants to manage marketplace listings and orders,
    run advertising campaigns, and process payments using Amazon Selling Partner API, Amazon Advertising API, and Amazon Pay
    API.
  tags:
  - Amazon
  - E-Commerce
  - Marketplace
  - Advertising
  - Payments
  created: '2026-04-19'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    SP_API_ACCESS_TOKEN: SP_API_ACCESS_TOKEN
    SP_API_REGION: SP_API_REGION
    AMAZON_ADS_ACCESS_TOKEN: AMAZON_ADS_ACCESS_TOKEN
    AMAZON_ADS_CLIENT_ID: AMAZON_ADS_CLIENT_ID
    AMAZON_PAY_PUBLIC_KEY_ID: AMAZON_PAY_PUBLIC_KEY_ID
    AMAZON_PAY_PRIVATE_KEY: AMAZON_PAY_PRIVATE_KEY
    AMAZON_PAY_MERCHANT_ID: AMAZON_PAY_MERCHANT_ID
capability:
  consumes:
  - type: http
    namespace: selling-partner
    baseUri: https://sellingpartnerapi-na.amazon.com
    description: Amazon SP-API for marketplace seller operations.
    authentication:
      type: bearer
      token: '{{SP_API_ACCESS_TOKEN}}'
    resources:
    - name: orders
      path: /orders/v0/orders
      description: Manage marketplace orders.
      operations:
      - name: get-orders
        method: GET
        description: Get orders based on filters.
        inputParameters:
        - name: MarketplaceIds
          in: query
          type: string
          required: true
          description: Marketplace IDs to filter orders.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: catalog-items
      path: /catalog/2022-04-01/items
      description: Search and retrieve catalog items.
      operations:
      - name: search-catalog-items
        method: GET
        description: Search Amazon catalog for items.
        inputParameters:
        - name: keywords
          in: query
          type: string
          required: false
          description: Search keywords.
        - name: marketplaceIds
          in: query
          type: string
          required: true
          description: Marketplace IDs.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: listings
      path: /listings/2021-08-01/items/{sellerId}
      description: Manage product listings.
      operations:
      - name: put-listings-item
        method: PUT
        description: Create or update a product listing.
        inputParameters:
        - name: sellerId
          in: path
          type: string
          required: true
          description: Seller identifier.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            productType: '{{tools.product_type}}'
  - type: http
    namespace: advertising
    baseUri: https://advertising-api.amazon.com
    description: Amazon Advertising API for campaign management.
    authentication:
      type: bearer
      token: '{{AMAZON_ADS_ACCESS_TOKEN}}'
    resources:
    - name: campaigns
      path: /v2/campaigns
      description: Manage advertising campaigns.
      operations:
      - name: list-campaigns
        method: GET
        description: List advertising campaigns.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-campaign
        method: POST
        description: Create a new advertising campaign.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            name: '{{tools.campaign_name}}'
            campaignType: '{{tools.campaign_type}}'
    - name: ad-groups
      path: /v2/adGroups
      description: Manage ad groups within campaigns.
      operations:
      - name: list-ad-groups
        method: GET
        description: List ad groups.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: reports
      path: /v2/reports
      description: Request advertising performance reports.
      operations:
      - name: request-report
        method: POST
        description: Request an advertising report.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: pay
    baseUri: https://pay-api.amazon.com
    description: Amazon Pay REST API for payment processing.
    authentication:
      type: bearer
      token: '{{AMAZON_PAY_PUBLIC_KEY_ID}}'
    resources:
    - name: checkout-sessions
      path: /live/v2/checkoutSessions
      description: Manage Amazon Pay checkout sessions.
      operations:
      - name: create-checkout-session
        method: POST
        description: Create a new checkout session.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            storeId: '{{tools.store_id}}'
      - name: get-checkout-session
        method: GET
        description: Get checkout session details.
        inputParameters:
        - name: checkoutSessionId
          in: path
          type: string
          required: true
          description: Checkout session ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: charges
      path: /live/v2/charges
      description: Manage payment charges.
      operations:
      - name: create-charge
        method: POST
        description: Create a payment charge.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: refunds
      path: /live/v2/refunds
      description: Process payment refunds.
      operations:
      - name: create-refund
        method: POST
        description: Create a refund for a charge.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: amazon-commerce-api
    description: Unified REST API for Amazon seller, advertising, and payment operations.
    resources:
    - path: /v1/orders
      name: orders
      description: Marketplace order management.
      operations:
      - method: GET
        name: get-orders
        description: Get marketplace orders.
        call: selling-partner.get-orders
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/catalog
      name: catalog
      description: Product catalog search.
      operations:
      - method: GET
        name: search-catalog
        description: Search Amazon product catalog.
        call: selling-partner.search-catalog-items
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/campaigns
      name: campaigns
      description: Advertising campaign management.
      operations:
      - method: GET
        name: list-campaigns
        description: List advertising campaigns.
        call: advertising.list-campaigns
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-campaign
        description: Create an advertising campaign.
        call: advertising.create-campaign
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/checkout-sessions
      name: checkout-sessions
      description: Amazon Pay checkout sessions.
      operations:
      - method: POST
        name: create-checkout-session
        description: Create a checkout session.
        call: pay.create-checkout-session
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/refunds
      name: refunds
      description: Payment refund processing.
      operations:
      - method: POST
        name: create-refund
        description: Process a payment refund.
        call: pay.create-refund
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: amazon-commerce-mcp
    transport: http
    description: MCP server for AI-assisted Amazon seller, advertising, and commerce operations.
    tools:
    - name: selling-partner-get-orders
      description: Get Amazon marketplace orders with filters by marketplace and date range.
      hints:
        readOnly: true
        openWorld: true
      call: selling-partner.get-orders
      outputParameters:
      - type: object
        mapping: $.
    - name: selling-partner-search-catalog
      description: Search the Amazon product catalog by keywords.
      hints:
        readOnly: true
        openWorld: true
      call: selling-partner.search-catalog-items
      outputParameters:
      - type: object
        mapping: $.
    - name: selling-partner-put-listing
      description: Create or update a product listing on Amazon.
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: selling-partner.put-listings-item
      outputParameters:
      - type: object
        mapping: $.
    - name: advertising-list-campaigns
      description: List Amazon advertising campaigns across all campaign types.
      hints:
        readOnly: true
        openWorld: true
      call: advertising.list-campaigns
      outputParameters:
      - type: object
        mapping: $.
    - name: advertising-create-campaign
      description: Create a new Amazon advertising campaign.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: advertising.create-campaign
      outputParameters:
      - type: object
        mapping: $.
    - name: advertising-request-report
      description: Request an advertising performance report.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: advertising.request-report
      outputParameters:
      - type: object
        mapping: $.
    - name: pay-create-checkout-session
      description: Create a new Amazon Pay checkout session for payment processing.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: pay.create-checkout-session
      outputParameters:
      - type: object
        mapping: $.
    - name: pay-create-charge
      description: Create a payment charge via Amazon Pay.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: pay.create-charge
      outputParameters:
      - type: object
        mapping: $.
    - name: pay-create-refund
      description: Process a refund for an Amazon Pay charge.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: pay.create-refund
      outputParameters:
      - type: object
        mapping: $.

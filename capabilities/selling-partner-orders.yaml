    resources:
    - name: orders-2026-01-01-orders
      path: /orders/2026-01-01/orders
      operations:
      - name: searchorders
        method: GET
        description: Amazon Search Orders
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: CreatedAfter
          in: query
          type: string
        - name: CreatedBefore
          in: query
          type: string
        - name: OrderStatuses
          in: query
          type: array
        - name: MaxResultsPerPage
          in: query

"""
Amazon Selling Partner API - Conceptual GraphQL Schema
Derived from the Amazon Selling Partner API (SP-API) REST surface:
  https://developer-docs.amazon.com/sp-api/
Covers: Orders, Fulfillment, Catalog, Inventory, Reports, Feeds,
        Finance, Notifications, Advertising, Vendors, and Account types.
"""

# ─── Scalars ────────────────────────────────────────────────────────────────

scalar DateTime
scalar Decimal
scalar JSON

# ─── Enums ──────────────────────────────────────────────────────────────────

enum OrderStatus {
  PENDING
  UNSHIPPED
  PARTIALLY_SHIPPED
  SHIPPED
  CANCELED
  UNFULFILLABLE
  INVOICE_UNCONFIRMED
  PENDING_AVAILABILITY
}

enum FulfillmentChannel {
  AFN
  MFN
}

enum OrderType {
  STANDARD_ORDER
  LONG_LEAD_TIME_ORDER
  PRE_ORDER
  BACK_ORDER
  SOURCING_ON_DEMAND_ORDER
}

enum ConditionType {
  NEW
  USED_LIKE_NEW
  USED_VERY_GOOD
  USED_GOOD
  USED_ACCEPTABLE
  COLLECTIBLE_LIKE_NEW
  COLLECTIBLE_VERY_GOOD
  COLLECTIBLE_GOOD
  COLLECTIBLE_ACCEPTABLE
  REFURBISHED_REFURBISHED
  CLUB_CLUB
}

enum ReportStatus {
  CANCELLED
  DONE
  FATAL
  IN_PROGRESS
  IN_QUEUE
}

enum FeedStatus {
  CANCELLED
  DONE
  FATAL
  IN_PROGRESS
  IN_QUEUE
}

enum NotificationEventType {
  ANY_OFFER_CHANGED
  FEED_PROCESSING_FINISHED
  FBA_OUTBOUND_SHIPMENT_STATUS
  FEE_PROMOTION
  FULFILLMENT_ORDER_STATUS
  ORDER_STATUS_CHANGE
  REPORT_PROCESSING_FINISHED
  BRANDED_ITEM_CONTENT_CHANGE
  ITEM_PRODUCT_TYPE_CHANGE
  LISTINGS_ITEM_STATUS_CHANGE
  LISTINGS_ITEM_ISSUES_CHANGE
  MFN_ORDER_STATUS_CHANGE
  B2B_ANY_OFFER_CHANGED
}

enum DestinationType {
  EVENT_BRIDGE
  SQS
}

enum ShipmentStatus {
  WORKING
  READY_TO_SHIP
  SHIPPED
  RECEIVING
  CANCELLED
  DELETED
  CLOSED
  ERROR
  IN_TRANSIT
  DELIVERED
  CHECKED_IN
}

enum InventorySupplySource {
  ReservedCustomerOrders
  InboundReceiving
  InboundWorking
  InboundShipped
  InboundReceivingSpecific
  Unfulfillable
  Fulfillable
}

enum FinancialEventGroupStatus {
  Open
  Closed
}

enum VendorOrderStatus {
  NEW
  ACKNOWLEDGED
  CLOSED
}

enum CurrencyCode {
  USD
  EUR
  GBP
  JPY
  CAD
  AUD
  INR
  BRL
  MXN
  SGD
}

# ─── Common value objects ─────────────────────────────────────────────────────

type Money {
  amount: Decimal!
  currencyCode: CurrencyCode!
}

type Weight {
  value: Decimal!
  unit: String!
}

type Dimensions {
  length: Decimal
  width: Decimal
  height: Decimal
  unit: String
}

type Address {
  name: String
  addressLine1: String
  addressLine2: String
  addressLine3: String
  city: String
  county: String
  district: String
  stateOrRegion: String
  postalCode: String
  countryCode: String!
  phone: String
}

type DateRange {
  start: DateTime!
  end: DateTime!
}

type PageToken {
  nextToken: String
}

# ─── Identifiers ─────────────────────────────────────────────────────────────

type ASIN {
  value: String!
}

type EAN {
  value: String!
}

type UPC {
  value: String!
}

type GTIN {
  type: String!
  value: String!
}


# ─── Root types ───────────────────────────────────────────────────────────────

type Query {
  # Account
  sellerAccount: SellerAccount
  marketplaces: [Marketplace!]!
  marketplace(id: String!): Marketplace

  # Orders
  orders(
    marketplaceIds: [String!]!
    createdAfter: DateTime
    createdBefore: DateTime
    lastUpdatedAfter: DateTime
    lastUpdatedBefore: DateTime
    orderStatuses: [OrderStatus!]
    fulfillmentChannels: [FulfillmentChannel!]
    paymentMethods: [String!]
    buyerEmail: String
    sellerOrderId: String
    maxResultsPerPage: Int
    easyShipShipmentStatuses: [String!]
    nextToken: String
  ): OrderList!

  order(orderId: String!): Order
  orderItems(orderId: String!): [OrderItem!]!

  # Catalog
  catalogItem(asin: String!, marketplaceIds: [String!]!, includedData: [String!]): CatalogItem
  searchCatalogItems(
    keywords: [String!]
    marketplaceIds: [String!]!
    brandNames: [String!]
    classificationIds: [String!]
    includedData: [String!]
    locale: String
    sellerId: String
    identifiers: [String!]
    identifiersType: String
    pageSize: Int
    pageToken: String
  ): CatalogItemList!

  # Listings
  listingItem(sellerId: String!, sku: String!, marketplaceIds: [String!]!, includedData: [String!]): ListingItem
  listingItems(sellerId: String!, marketplaceIds: [String!]!, sku: String, pageToken: String): ListingItemList!

  # Pricing
  itemPricing(asin: String!, marketplaceId: String!, itemType: String!, condition: ConditionType): ItemPricing
  competitivePricing(asin: String!, marketplaceId: String!): ItemPricing

  # Inventory
  inventory(sellerSKU: String!, marketplaceId: String!): Inventory
  fbaInventory(
    granularityType: String!
    granularityId: String!
    marketplaceIds: [String!]!
    startDateTime: DateTime
    sellerSkus: [String!]
    nextToken: String
    details: Boolean
  ): FBAInventoryList!

  # Reports
  report(reportId: String!): Report
  reports(
    reportTypes: [String!]
    processingStatuses: [ReportStatus!]
    marketplaceIds: [String!]
    pageSize: Int
    createdSince: DateTime
    createdUntil: DateTime
    nextToken: String
  ): ReportList!
  reportDocument(reportDocumentId: String!): ReportDocument
  reportSchedules(reportTypes: [String!]): [ReportSchedule!]!

  # Feeds
  feed(feedId: String!): Feed
  feeds(
    feedTypes: [String!]
    marketplaceIds: [String!]
    pageSize: Int
    processingStatuses: [FeedStatus!]
    createdSince: DateTime
    createdUntil: DateTime
    nextToken: String
  ): FeedList!
  feedDocument(feedDocumentId: String!): FeedDocument

  # Finance
  financeGroups(
    maxResultsPerPage: Int
    financialEventGroupStartedBefore: DateTime
    financialEventGroupStartedAfter: DateTime
    nextToken: String
  ): FinanceList!
  financialEvents(
    marketplaceId: String
    maxResultsPerPage: Int
    postedAfter: DateTime
    postedBefore: DateTime
    nextToken: String
  ): FinancialEventList!

  # Fulfillment
  fulfillmentOrder(sellerFulfillmentOrderId: String!): Fulfillment
  fbaShipment(shipmentId: String!): FBAShipment
  fbaShipments(shipmentStatusList: [ShipmentStatus!], nextToken: String): FBAShipmentList!

  # Notifications
  subscriptions(notificationType: NotificationEventType!): [Subscription!]!
  destinations: [Destination!]!

  # Browse / Category
  browseNode(browseNodeId: String!, marketplaceId: String!): BrowseNode
  category(categoryId: String!, marketplaceId: String!): Category

  # Vendor
  vendorOrders(
    limit: Int
    sortOrder: String
    nextToken: String
    createdAfter: DateTime
    createdBefore: DateTime
    purchaseOrderState: VendorOrderStatus
  ): VendorOrderList!

  # Deals / Promotions
  deals(nextToken: String, filter: String): [Deal!]!
  coupons(nextToken: String): [Coupon!]!

  # Shipping
  shipment(shipmentId: String!): Shipment
  tracking(trackingId: String!, carrierId: String): TrackingInfo

  # Metrics
  customerMetrics(
    marketplaceId: String!
    interval: String!
    metrics: [String!]
    timePeriodType: String
    nextToken: String
  ): CustomerMetrics
}

type Mutation {
  # Orders
  confirmShipment(orderId: String!, packageReferenceId: String!, input: ConfirmShipmentInput!): Boolean

  # Listings
  putListingItem(sellerId: String!, sku: String!, marketplaceIds: [String!]!, input: JSON!): ListingSubmissionResponse!
  deleteListingItem(sellerId: String!, sku: String!, marketplaceIds: [String!]!): ListingSubmissionResponse!
  patchListingItem(sellerId: String!, sku: String!, marketplaceIds: [String!]!, patches: [JSON!]!): ListingSubmissionResponse!

  # Feeds
  createFeed(feedType: String!, marketplaceIds: [String!]!, feedDocumentId: String!, feedOptions: JSON): Feed!
  createFeedDocument(contentType: String!): FeedDocument!

  # Reports
  createReport(reportType: String!, marketplaceIds: [String!]!, dataStartTime: DateTime, dataEndTime: DateTime, reportOptions: JSON): Report!
  cancelReport(reportId: String!): Boolean
  createReportSchedule(reportType: String!, marketplaceIds: [String!]!, period: String!, nextReportCreationTime: DateTime, reportOptions: JSON): ReportSchedule!
  cancelReportSchedule(reportScheduleId: String!): Boolean

  # Fulfillment
  createFulfillmentOrder(input: CreateFulfillmentOrderInput!): Boolean
  updateFulfillmentOrder(sellerFulfillmentOrderId: String!, input: UpdateFulfillmentOrderInput!): Boolean
  cancelFulfillmentOrder(sellerFulfillmentOrderId: String!): Boolean
  createFBAInboundShipment(input: CreateFBAShipmentInput!): FBAShipment!
  updateFBAInboundShipment(shipmentId: String!, input: UpdateFBAShipmentInput!): FBAShipment!

  # Notifications
  createSubscription(notificationType: NotificationEventType!, payloadVersion: String!, destinationId: String!): Subscription!
  deleteSubscription(subscriptionId: String!, notificationType: NotificationEventType!): Boolean
  createDestination(name: String!, resourceSpecification: JSON!): Destination!
  deleteDestination(destinationId: String!): Boolean

  # Vendor
  submitAcknowledgement(purchaseOrderNumber: String!, acknowledgementCode: String!, acknowledgementDate: DateTime!): Boolean
  submitShipmentConfirmation(input: VendorShipmentInput!): Boolean

  # Pricing
  submitPriceUpdate(sku: String!, marketplaceId: String!, price: Money!, salePrice: Money, salePriceStartDate: DateTime, salePriceEndDate: DateTime): Boolean

  # Messaging
  sendInvoice(amazonOrderId: String!, marketplaceId: String!): Boolean
  sendDigitalAccessKey(amazonOrderId: String!, marketplaceId: String!): Boolean
  requestReview(amazonOrderId: String!, marketplaceId: String!): Boolean

  # Shipping
  createShipment(input: CreateShipmentInput!): Shipment!
  cancelShipment(shipmentId: String!): Boolean
}


description: Amazon Ads operates a first-party hosted MCP server, the Amazon Ads MCP Server, at https://advertising-ai.amazon.com/mcp.
  Amazon's docs describe it as a standardized access layer that translates the Amazon Ads API into MCP primitives
  so LLMs and agents can query campaigns, performance metrics, billing and account information in natural language.
  The docs name two primitives, Tools and Skills (beta, pre-defined prompts provided by Amazon Ads that guide
  AI applications through Ads workflows and tool usage). Open beta since 2026-02-02, after a closed beta from
  November 2025 (dates from the parent session's verified evidence; the docs pages fetched here do not carry
  them). The docs navigation also lists "MCP Tools (beta)" and a separate "Connecting to Ads MCP Lite" path.
  No tool list was harvested because tools/list needs an authenticated session.
servers:
- name: amazon-ads-mcp
  label: Amazon Ads MCP Server
  transport: http
  url: https://advertising-ai.amazon.com/mcp
  auth: oauth2
  auth_detail: OAuth 2.1 through Login with Amazon (authorization server https://lwa.amazon.com, PKCE S256,
    scope advertising::campaign_management). Prerequisites are an approved application with access to the
    Amazon Ads API and your own Client ID from a Login with Amazon security profile. A public client uses the
    Client ID only (access token expires after one hour). A private client uses Client ID plus Client Secret
    and refreshes automatically. Each MCP client's callback URL has to be added to the security profile's
    Allowed Return URLs, or the flow fails with a redirect URI mismatch.
  docs: https://advertising.amazon.com/API/docs/en-us/mcp/mcp-overview
  auth_docs: https://advertising.amazon.com/API/docs/en-us/mcp/oauth
